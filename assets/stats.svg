<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 150" width="900" height="150" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<linearGradient id="num" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#8E7CFF"/><stop offset="1" stop-color="#00C9A7"/></linearGradient>
<linearGradient id="bd" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#512BD4"/><stop offset="1" stop-color="#00C9A7"/></linearGradient>
</defs>
<style>
.c{transform-box:fill-box;transform-origin:center;animation:pop .8s cubic-bezier(.2,.9,.3,1.3) both}
@keyframes pop{0%{opacity:0;transform:translateY(24px) scale(.9)}100%{opacity:1;transform:none}}
</style>
<g class="c" style="animation-delay:0.00s">
<rect x="2" y="10" width="160" height="128" rx="16" fill="#0d1117" stroke="url(#bd)" stroke-width="2">
<animate attributeName="stroke-opacity" values="1;.35;1" dur="3s" begin="0.0s" repeatCount="indefinite"/></rect>
<text x="82" y="66" text-anchor="middle" font-size="40" font-weight="800" fill="url(#num)">100+</text>
<text x="82" y="92" text-anchor="middle" font-size="14" font-weight="700" fill="#e6edf3">IoT devices</text>
<text x="82" y="112" text-anchor="middle" font-size="11" fill="#8b949e">→ live ERP dashboards</text></g>
<g class="c" style="animation-delay:0.18s">
<rect x="186" y="10" width="160" height="128" rx="16" fill="#0d1117" stroke="url(#bd)" stroke-width="2">
<animate attributeName="stroke-opacity" values="1;.35;1" dur="3s" begin="0.4s" repeatCount="indefinite"/></rect>
<text x="266" y="66" text-anchor="middle" font-size="40" font-weight="800" fill="url(#num)">18</text>
<text x="266" y="92" text-anchor="middle" font-size="14" font-weight="700" fill="#e6edf3">modules</text>
<text x="266" y="112" text-anchor="middle" font-size="11" fill="#8b949e">one compliance platform</text></g>
<g class="c" style="animation-delay:0.36s">
<rect x="370" y="10" width="160" height="128" rx="16" fill="#0d1117" stroke="url(#bd)" stroke-width="2">
<animate attributeName="stroke-opacity" values="1;.35;1" dur="3s" begin="0.8s" repeatCount="indefinite"/></rect>
<text x="450" y="66" text-anchor="middle" font-size="40" font-weight="800" fill="url(#num)">120+</text>
<text x="450" y="92" text-anchor="middle" font-size="14" font-weight="700" fill="#e6edf3">REST endpoints</text>
<text x="450" y="112" text-anchor="middle" font-size="11" fill="#8b949e">delivered &amp; documented</text></g>
<g class="c" style="animation-delay:0.54s">
<rect x="554" y="10" width="160" height="128" rx="16" fill="#0d1117" stroke="url(#bd)" stroke-width="2">
<animate attributeName="stroke-opacity" values="1;.35;1" dur="3s" begin="1.2000000000000002s" repeatCount="indefinite"/></rect>
<text x="634" y="66" text-anchor="middle" font-size="40" font-weight="800" fill="url(#num)">10+</text>
<text x="634" y="92" text-anchor="middle" font-size="14" font-weight="700" fill="#e6edf3">production backends</text>
<text x="634" y="112" text-anchor="middle" font-size="11" fill="#8b949e">shipped end to end</text></g>
<g class="c" style="animation-delay:0.72s">
<rect x="738" y="10" width="160" height="128" rx="16" fill="#0d1117" stroke="url(#bd)" stroke-width="2">
<animate attributeName="stroke-opacity" values="1;.35;1" dur="3s" begin="1.6s" repeatCount="indefinite"/></rect>
<text x="818" y="66" text-anchor="middle" font-size="40" font-weight="800" fill="url(#num)">2</text>
<text x="818" y="92" text-anchor="middle" font-size="14" font-weight="700" fill="#e6edf3">environments</text>
<text x="818" y="112" text-anchor="middle" font-size="11" fill="#8b949e">stage &amp; prod, push-to-deploy</text></g>
